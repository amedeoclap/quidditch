<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sky Spheres - Enhanced Web Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            display: none;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: none;
            z-index: 10;
        }

        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        #timer {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            flex: 1;
        }

        #distance {
            font-size: 18px;
            padding: 10px 20px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 20px;
        }

        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 100;
            text-align: center;
            padding: 20px;
            white-space: pre-line;
        }

        #notification.show {
            opacity: 1;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }

        #startScreen.hidden {
            display: none;
        }

        #title {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #subtitle {
            font-size: 24px;
            margin-bottom: 40px;
            color: #FFD700;
        }

        .menu-button {
            font-size: 28px;
            padding: 20px 60px;
            margin: 10px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }

        .menu-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.8);
        }

        .menu-button:active {
            transform: translateY(0);
        }

        .menu-button.secondary {
            background: linear-gradient(135deg, #4a7c59, #2a4c39);
            color: white;
        }

        #instructions {
            margin-top: 40px;
            text-align: center;
            font-size: 16px;
            max-width: 600px;
            line-height: 1.6;
        }

        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            pointer-events: auto;
            z-index: 50;
        }

        .joystick {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .joystick-handle {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .action-button {
            width: 90px;
            height: 90px;
            background: rgba(255, 215, 0, 0.6);
            border: 3px solid rgba(255, 215, 0, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            touch-action: none;
        }

        @media (max-width: 768px) {
            #title {
                font-size: 48px;
            }
            .menu-button {
                font-size: 24px;
                padding: 15px 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen">
        <div id="title">⚡ SKY SPHERES ⚡</div>
        <div id="subtitle">Enhanced Fantasy Sports Game</div>
        <button id="startButton" class="menu-button">INIZIA</button>
        <button onclick="window.gameAPI.toggleSettings()" class="menu-button secondary">⚙️ IMPOSTAZIONI</button>
        <button onclick="window.showLeaderboard()" class="menu-button secondary">🏆 CLASSIFICA</button>
        <div id="instructions">
            <p><strong>OBIETTIVO:</strong> Insegui e cattura il Radiant Globe dorato!</p>
            <br>
            <p><strong>CONTROLLI MOBILE:</strong></p>
            <p>Joystick = Movimento | Bottone Boost = Velocità</p>
            <br>
            <p><strong>FUNZIONALITÀ:</strong></p>
            <p>🎵 Audio procedurale | ⭐ Particelle | 🏆 Classifica | 📊 Statistiche</p>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="topBar">
            <div id="distance">🎯 Distanza: -- m</div>
            <div id="timer">⏱️ 0:00</div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls">
        <div id="joystick" class="joystick">
            <div class="joystick-handle"></div>
        </div>
        <div id="boostButton" class="action-button">BOOST</div>
    </div>

    <!-- Notification -->
    <div id="notification"></div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Enhanced Game Script -->
    <script src="game-enhanced.js"></script>

    <!-- Initialize -->
    <script>
        // Wait for everything to load, then setup start button
        window.addEventListener('load', function() {
            const startButton = document.getElementById('startButton');
            if (startButton && window.gameAPI && window.gameAPI.startGame) {
                startButton.addEventListener('click', function() {
                    window.gameAPI.startGame();
                });
            }
        });

        // Check if Three.js loaded
        setTimeout(function() {
            if (typeof THREE === 'undefined') {
                alert('ATTENZIONE: Three.js non caricato.\n\nServe connessione internet per caricare la libreria 3D.\n\nRicarica la pagina quando sei connesso.');
            }
        }, 2000);
    </script>
</body>
</html>
