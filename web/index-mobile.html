<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sky Spheres - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }

        #startScreen.hidden {
            display: none;
        }

        #title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #subtitle {
            font-size: 20px;
            margin-bottom: 30px;
            color: #FFD700;
        }

        #startButton {
            font-size: 32px;
            padding: 20px 60px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
        }

        #startButton:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(255, 215, 0, 0.3);
        }

        #loadingText {
            margin-top: 20px;
            font-size: 16px;
            color: #ccc;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }

        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.5);
        }

        #distance {
            font-size: 16px;
            padding: 8px 15px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 15px;
        }

        #timer {
            font-size: 20px;
            font-weight: bold;
        }

        #notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }

        #notification.show {
            opacity: 1;
        }

        #mobileControls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
            z-index: 100;
        }

        .joystick {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .joystick-handle {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }

        .action-button {
            width: 90px;
            height: 90px;
            background: rgba(255, 215, 0, 0.6);
            border: 3px solid rgba(255, 215, 0, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            touch-action: none;
        }

        .action-button:active {
            background: rgba(255, 215, 0, 0.9);
            transform: scale(0.95);
        }

        #debugLog {
            position: fixed;
            bottom: 150px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            font-size: 10px;
            max-width: 90%;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Debug Log -->
    <div id="debugLog"></div>

    <!-- Start Screen -->
    <div id="startScreen">
        <div id="title">⚡ SKY SPHERES ⚡</div>
        <div id="subtitle">Mobile Fantasy Game</div>
        <button id="startButton">INIZIA</button>
        <div id="loadingText"></div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display:none;">
        <div id="topBar">
            <div id="distance">🎯 --m</div>
            <div id="timer">⏱️ 0:00</div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls" style="display:none;">
        <div id="joystick" class="joystick">
            <div class="joystick-handle"></div>
        </div>
        <div id="boostButton" class="action-button">BOOST</div>
    </div>

    <!-- Notification -->
    <div id="notification"></div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" style="display:none;"></canvas>

    <!-- Three.js from CDN with fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            onerror="handleThreeJsError()"></script>

    <script>
        // Debug logging
        function log(msg) {
            console.log(msg);
            const debugLog = document.getElementById('debugLog');
            if (debugLog) {
                debugLog.innerHTML += msg + '<br>';
                debugLog.scrollTop = debugLog.scrollHeight;
            }
        }

        // Show debug on mobile
        if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
            document.getElementById('debugLog').style.display = 'block';
        }

        log('Pagina caricata');
        log('User Agent: ' + navigator.userAgent.substring(0, 50));

        // Handle Three.js loading error
        function handleThreeJsError() {
            log('ERRORE: Three.js non caricato da CDN');
            document.getElementById('loadingText').innerHTML =
                '❌ Errore caricamento<br>' +
                'Serve connessione internet<br>' +
                'Oppure usa versione offline';
        }

        // Check if Three.js loaded
        let checkCount = 0;
        const checkThree = setInterval(() => {
            checkCount++;
            if (typeof THREE !== 'undefined') {
                log('✓ Three.js caricato!');
                clearInterval(checkThree);
                document.getElementById('loadingText').textContent = '✓ Pronto!';
            } else if (checkCount > 50) {
                log('✗ Three.js timeout');
                clearInterval(checkThree);
                handleThreeJsError();
            }
        }, 100);

        // Game variables
        let scene, camera, renderer;
        let player, globe;
        let playerVelocity = new THREE.Vector3();
        let globeVelocity = new THREE.Vector3();
        let gameStarted = false;
        let gameTime = 0;
        let captured = false;

        // Mobile controls
        let joystickActive = false;
        let joystickDirection = { x: 0, y: 0 };
        let isBoosting = false;
        let touchStartX = 0, touchStartY = 0;

        // Settings
        const PLAYER_SPEED = 0.25;
        const PLAYER_BOOST = 0.5;
        const GLOBE_SPEED = 0.12;
        const CAPTURE_DISTANCE = 3;
        const BOUNDS = { x: 40, y: 25, z: 40 };

        document.getElementById('startButton').addEventListener('click', function() {
            log('Bottone INIZIA cliccato');

            if (typeof THREE === 'undefined') {
                log('ERRORE: Three.js non disponibile');
                alert('Errore: Libreria 3D non caricata.\n\nServe connessione internet per caricare Three.js.\n\nRicarica la pagina e riprova.');
                return;
            }

            log('Inizializzazione gioco...');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('mobileControls').style.display = 'flex';

            try {
                init();
                gameStarted = true;
                log('Gioco inizializzato con successo');
                animate();
            } catch (e) {
                log('ERRORE init: ' + e.message);
                alert('Errore inizializzazione: ' + e.message);
            }
        });

        function init() {
            log('Init: Creazione scena...');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 12, 20);
            log('Init: Camera creata');

            // Renderer
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: false, // Disattivo per performance mobile
                powerPreference: 'default'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limita per performance
            log('Init: Renderer creato');

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
            sunLight.position.set(50, 100, 30);
            scene.add(sunLight);
            log('Init: Luci aggiunte');

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(150, 150);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x4a7c59 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -5;
            scene.add(ground);
            log('Init: Ground creato');

            // Player
            const playerGeometry = new THREE.CapsuleGeometry(0.5, 2, 4, 8);
            const playerMaterial = new THREE.MeshLambertMaterial({ color: 0x00CED1 });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(0, 3, 0);
            scene.add(player);

            const playerLight = new THREE.PointLight(0x00CED1, 1, 8);
            player.add(playerLight);
            log('Init: Player creato');

            // Globe
            const globeGeometry = new THREE.SphereGeometry(0.5, 16, 16);
            const globeMaterial = new THREE.MeshLambertMaterial({
                color: 0xFFD700,
                emissive: 0xFFD700,
                emissiveIntensity: 0.3
            });
            globe = new THREE.Mesh(globeGeometry, globeMaterial);
            globe.position.set(15, 12, 15);
            scene.add(globe);

            const globeLight = new THREE.PointLight(0xFFD700, 2, 15);
            globe.add(globeLight);
            log('Init: Globe creato');

            // Initial globe velocity
            globeVelocity.set(
                (Math.random() - 0.5) * GLOBE_SPEED,
                (Math.random() - 0.5) * GLOBE_SPEED * 0.5,
                (Math.random() - 0.5) * GLOBE_SPEED
            );

            // Setup controls
            setupMobileControls();

            window.addEventListener('resize', onWindowResize);

            log('Init: Completo!');
        }

        function setupMobileControls() {
            const joystick = document.getElementById('joystick');
            const handle = joystick.querySelector('.joystick-handle');
            const boostButton = document.getElementById('boostButton');

            joystick.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const rect = joystick.getBoundingClientRect();
                touchStartX = rect.left + rect.width / 2;
                touchStartY = rect.top + rect.height / 2;
                log('Joystick attivato');
            });

            joystick.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                e.preventDefault();
                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;
                const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), 35);
                const angle = Math.atan2(deltaY, deltaX);

                handle.style.transform = `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px))`;

                joystickDirection.x = Math.cos(angle) * (distance / 35);
                joystickDirection.y = Math.sin(angle) * (distance / 35);
            });

            joystick.addEventListener('touchend', () => {
                joystickActive = false;
                handle.style.transform = 'translate(-50%, -50%)';
                joystickDirection.x = 0;
                joystickDirection.y = 0;
            });

            boostButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isBoosting = true;
                log('Boost ON');
            });

            boostButton.addEventListener('touchend', () => {
                isBoosting = false;
            });

            log('Controlli mobile configurati');
        }

        function updatePlayer() {
            const speed = isBoosting ? PLAYER_BOOST : PLAYER_SPEED;

            if (joystickActive) {
                playerVelocity.x += joystickDirection.x * speed;
                playerVelocity.z += joystickDirection.y * speed;
            }

            player.position.add(playerVelocity);
            playerVelocity.multiplyScalar(0.88);

            player.position.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, player.position.x));
            player.position.y = Math.max(0, Math.min(BOUNDS.y, player.position.y));
            player.position.z = Math.max(-BOUNDS.z, Math.min(BOUNDS.z, player.position.z));

            if (playerVelocity.length() > 0.01) {
                const targetRotation = Math.atan2(playerVelocity.x, playerVelocity.z);
                player.rotation.y += (targetRotation - player.rotation.y) * 0.1;
            }
        }

        function updateGlobe() {
            const time = Date.now() * 0.001;

            globeVelocity.x += Math.sin(time * 0.7) * 0.008;
            globeVelocity.y += Math.cos(time * 0.5) * 0.004;
            globeVelocity.z += Math.sin(time * 0.9) * 0.008;

            const distanceToPlayer = globe.position.distanceTo(player.position);
            if (distanceToPlayer < 15) {
                const evasionDirection = new THREE.Vector3()
                    .subVectors(globe.position, player.position)
                    .normalize();
                globeVelocity.add(evasionDirection.multiplyScalar(0.015));
            }

            globe.position.add(globeVelocity);

            if (globeVelocity.length() > GLOBE_SPEED * 2) {
                globeVelocity.normalize().multiplyScalar(GLOBE_SPEED * 2);
            }

            ['x', 'y', 'z'].forEach(axis => {
                const bound = axis === 'y' ? BOUNDS.y : (axis === 'x' ? BOUNDS.x : BOUNDS.z);
                const min = axis === 'y' ? 2 : -bound;
                const max = bound;

                if (globe.position[axis] < min || globe.position[axis] > max) {
                    globeVelocity[axis] *= -1;
                    globe.position[axis] = Math.max(min, Math.min(max, globe.position[axis]));
                }
            });

            globe.rotation.y += 0.02;
            const pulse = 1 + Math.sin(time * 3) * 0.08;
            globe.scale.set(pulse, pulse, pulse);
        }

        function updateCamera() {
            const targetPosition = new THREE.Vector3(
                player.position.x,
                player.position.y + 10,
                player.position.z + 18
            );
            camera.position.lerp(targetPosition, 0.05);
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
        }

        function updateHUD() {
            const distance = player.position.distanceTo(globe.position);
            document.getElementById('distance').textContent = `🎯 ${distance.toFixed(1)}m`;

            const minutes = Math.floor(gameTime / 60);
            const seconds = Math.floor(gameTime % 60);
            document.getElementById('timer').textContent = `⏱️ ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function checkCapture() {
            const distance = player.position.distanceTo(globe.position);
            if (distance < CAPTURE_DISTANCE && !captured) {
                captured = true;
                log('CATTURATO!');
                showNotification('🎉 CATTURATO! 🎉');

                setTimeout(() => {
                    const time = `${Math.floor(gameTime / 60)}:${Math.floor(gameTime % 60).toString().padStart(2, '0')}`;
                    showNotification(`Tempo: ${time}`);
                    setTimeout(() => {
                        if (confirm('Vuoi giocare ancora?')) {
                            location.reload();
                        }
                    }, 2500);
                }, 2000);
            }
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 1800);
        }

        function animate() {
            if (!gameStarted) return;
            requestAnimationFrame(animate);

            if (!captured) {
                gameTime += 1/60;
                updatePlayer();
                updateGlobe();
                updateCamera();
                updateHUD();
                checkCapture();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        log('Script caricato completamente');
    </script>
</body>
</html>
